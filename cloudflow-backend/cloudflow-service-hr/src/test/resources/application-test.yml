# ==================== 测试环境配置 ====================
spring:
  application:
    name: cloudflow-service-hr-test
  
  # 禁用 Nacos
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  
  # 使用内存数据库 H2
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  
  # 禁用 Redis（使用 Mock）
  data:
    redis:
      host: localhost
      port: 6379
  
  # 禁用 RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672

# 禁用 Feign
feign:
  client:
    config:
      default:
        connect-timeout: 1000
        read-timeout: 1000

# 日志级别
logging:
  level:
    root: INFO
    com.cloudflow.hr: DEBUG
