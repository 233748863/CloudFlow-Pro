server:
  port: 9005
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: cloudflow-service-hr
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:cloudflow-service-hr.yaml
      - optional:nacos:cloudflow-common.yaml?refresh=true
  cloud:
    nacos:
      server-addr: 192.168.1.173:8848
      username: nacos
      password: nacos
      config:
        namespace: 886292cd-bfe3-4651-a67a-7604d2f4f3b9
        file-extension: yaml
        refresh-enabled: true
      discovery:
        namespace: 886292cd-bfe3-4651-a67a-7604d2f4f3b9
        enabled: true
        register-enabled: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.173:3306/cloudflow_hr?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_0900_ai_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: HRHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-idle: 20
          min-idle: 5
          max-wait: -1ms
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.cloudflow.hr.domain.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-read-body: false
  is-read-header: true
  is-read-cookie: false
  is-log: false

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: BASIC
      cloudflow-auth:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: BASIC
      cloudflow-service-workflow:
        connect-timeout: 5000
        read-timeout: 15000
        logger-level: BASIC
  circuitbreaker:
    enabled: true
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 2048
    response:
      enabled: true
  okhttp:
    enabled: false
  httpclient:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Pro HR 人力资源管理微服务
    version: 1.0.0
    encoding: ${project.build.sourceEncoding}
    java:
      version: ${java.version}

logging:
  level:
    root: INFO
    com.cloudflow.hr: DEBUG
    com.cloudflow.hr.mapper: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/hr-service.log
    max-size: 100MB
    max-history: 30

cloudflow:
  tenant:
    enabled: true
    column: tenant_id
    ignore-tables:
      - sys_tenant
      - sys_menu
      - sys_dict_type
      - sys_dict_data
      - sys_config
    default-tenant-id: 100000
  file-storage:
    type: local
    presigned-expire-minutes: 30
  oss:
    enabled: false
    config-key: default
    endpoint: localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: cloudflow-hr
    region: us-east-1
    is-https: N
    access-policy: 1
    prefix: hr
    domain:
  profile: /data/cloudflow/hr/profile
  hr:
    sync:
      full-sync-on-startup: true
      incremental-sync-interval: 5
      realtime-sync-enabled: true
    attendance:
      gps-range: 500
      late-threshold: 15
      early-threshold: 15
    leave:
      annual-leave-days-per-year: 5
      annual-leave-max-days: 15
    overtime:
      workday-ratio: 1.0
      weekend-ratio: 2.0
      holiday-ratio: 3.0
    workflow:
      process-keys:
        leave: leave_request
        overtime: overtime_request
        attendance-supplement: attendance_appeal
        offer: offer_approval
        onboarding: onboarding_approval
        probation-confirmation: probation_confirmation_approval
        recruitment-request: biz_recruit
        resignation: resignation_approval
        salary-adjustment: salary_adjustment_approval
        transfer: transfer_approval
    audit-log:
      archive-days: 90
      delete-days: 365
