server:
  port: 9005
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  autoconfigure:
    exclude:
      - io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimiterAutoConfiguration
      - io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimiterMetricsAutoConfiguration
      - io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimitersHealthIndicatorAutoConfiguration
  application:
    name: cloudflow-service-hr
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    nacos:
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
        file-extension: yaml
        refresh-enabled: true
      discovery:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
        enabled: true
        register-enabled: true
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:cloudflow-common-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:${spring.application.name}.yaml?refresh=true
      - optional:nacos:cloudflow-common.yaml?refresh=true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: HRHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-idle: 20
          min-idle: 5
          max-wait: -1ms
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.cloudflow.hr.domain.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  cookie-auto-fill-prefix: true
  timeout: 86400
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-read-body: false
  is-read-header: true
  is-read-cookie: true
  is-log: false

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: BASIC
      cloudflow-auth:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: BASIC
      cloudflow-service-workflow:
        connect-timeout: 5000
        read-timeout: 15000
        logger-level: BASIC
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 2048
    response:
      enabled: true
  okhttp:
    enabled: false
  httpclient:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9105}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Pro HR 人力资源管理微服务
    version: 1.0.0
    encoding: ${project.build.sourceEncoding}
    java:
      version: ${java.version}

logging:
  level:
    root: INFO
    com.cloudflow.hr: ${LOG_LEVEL_APP:INFO}
    com.cloudflow.hr.mapper: ${LOG_LEVEL_MAPPER:WARN}
    com.baomidou.mybatisplus: ${LOG_LEVEL_MAPPER:WARN}
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/hr-service.log
    max-size: 100MB
    max-history: 30

cloudflow:
  encrypt:
    enabled: ${CLOUDFLOW_ENCRYPT_ENABLED:false}
    aes-key: ${CLOUDFLOW_ENCRYPT_AES_KEY:}
    sm4-key: ${CLOUDFLOW_ENCRYPT_SM4_KEY:}
  tenant:
    enabled: true
    column: tenant_id
    ignore-tables:
      - sys_tenant
      - sys_menu
      - sys_config
      - workflow_template
      - template_category
    default-tenant-id: 100000
