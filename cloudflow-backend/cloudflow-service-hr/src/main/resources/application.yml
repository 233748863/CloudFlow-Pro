# ==================== 服务器配置 ====================
server:
  port: 9005
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ==================== Spring 应用配置 ====================
spring:
  application:
    name: cloudflow-service-hr
  profiles:
    active: dev
  
  # ==================== Nacos 配置中心 ====================
  config:
    import:
      - optional:nacos:cloudflow-service-hr.yaml
      - optional:nacos:cloudflow-common.yaml?refresh=true
  
  cloud:
    nacos:
      # Nacos 服务器地址
      server-addr: 192.168.1.173:8848
      username: nacos
      password: nacos
      # 配置中心配置
      config:
        namespace: 886292cd-bfe3-4651-a67a-7604d2f4f3b9
        file-extension: yaml
        refresh-enabled: true
      # 服务发现配置
      discovery:
        namespace: 886292cd-bfe3-4651-a67a-7604d2f4f3b9
        enabled: true
        register-enabled: true
  
  # ==================== 数据源配置 ====================
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.173:3306/cloudflow_hr?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: HRHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  
  # ==================== Redis 配置 ====================
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-idle: 20
          min-idle: 5
          max-wait: -1ms
  
  # ==================== RabbitMQ 配置 ====================
  rabbitmq:
    host: 192.168.1.173
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        # 手动确认消息
        acknowledge-mode: manual
        # 并发消费者数量
        concurrency: 5
        max-concurrency: 10
        # 每次从队列中取出的消息数量
        prefetch: 1
        # 消费失败后是否重新入队
        default-requeue-rejected: true
    template:
      # 消息发送确认
      mandatory: true
      # 发布确认
      publisher-confirm-type: correlated
      # 发布返回
      publisher-returns: true
  
  # ==================== 文件上传配置 ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  # 实体类包路径
  type-aliases-package: com.cloudflow.hr.domain.entity
  # 全局配置
  global-config:
    db-config:
      # 主键类型（AUTO: 数据库自增，ASSIGN_ID: 雪花算法）
      id-type: ASSIGN_ID
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
    # 是否打印 Banner
    banner: false
  # MyBatis 配置
  configuration:
    # 驼峰命名转换
    map-underscore-to-camel-case: true
    # 缓存配置
    cache-enabled: false
    # 日志实现（开发环境使用，生产环境注释掉）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== Sa-Token 安全配置 ====================
sa-token:
  # Token 名称（同时也是 Cookie 名称）
  token-name: Authorization
  # Token 前缀
  token-prefix: Bearer
  # Token 有效期（单位：秒）默认30天，-1代表永不过期
  timeout: 86400
  # Token 临时有效期（指定时间内无操作就视为 Token 过期）单位：秒
  active-timeout: -1
  # 是否允许同一账号并发登录（为 true 时允许一起登录，为 false 时新登录挤掉旧登录）
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个 Token（为 true 时所有登录共用一个 Token，为 false 时每次登录新建一个 Token）
  is-share: false
  # 是否尝试从请求体里读取 Token
  is-read-body: false
  # 是否尝试从 header 里读取 Token
  is-read-header: true
  # 是否尝试从 cookie 里读取 Token
  is-read-cookie: false
  # 是否输出操作日志
  is-log: false

# ==================== OpenFeign 配置 ====================
feign:
  client:
    config:
      default:
        # 连接超时时间（毫秒）
        connect-timeout: 5000
        # 读取超时时间（毫秒）
        read-timeout: 10000
        # 日志级别：NONE, BASIC, HEADERS, FULL
        logger-level: BASIC
      # Auth服务专用配置
      cloudflow-service-auth:
        # 连接超时时间（毫秒）
        connect-timeout: 3000
        # 读取超时时间（毫秒）
        read-timeout: 5000
        # 日志级别
        logger-level: BASIC
      # Workflow服务专用配置
      cloudflow-service-workflow:
        # 连接超时时间（毫秒）
        connect-timeout: 5000
        # 读取超时时间（毫秒）- 工作流操作可能较慢
        read-timeout: 15000
        # 日志级别
        logger-level: BASIC
  # 启用熔断器
  circuitbreaker:
    enabled: true
  # 启用请求压缩
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 2048
    response:
      enabled: true
  # 启用 OkHttp 客户端（可选，性能更好）
  okhttp:
    enabled: false
  # 启用 HttpClient 客户端（可选）
  httpclient:
    enabled: false

# ==================== Actuator 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        # 暴露的端点
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      # 显示健康检查详情
      show-details: when-authorized
      # 启用探针
      probes:
        enabled: true
  health:
    # Redis 健康检查
    redis:
      enabled: true
    # 数据库健康检查
    db:
      enabled: true
    # RabbitMQ 健康检查
    rabbitmq:
      enabled: true
  metrics:
    tags:
      # 应用名称标签
      application: ${spring.application.name}

# ==================== 应用信息配置 ====================
info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Pro HR人力资源管理微服务
    version: 1.0.0
    encoding: ${project.build.sourceEncoding}
    java:
      version: ${java.version}

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.cloudflow.hr: DEBUG
    com.cloudflow.hr.mapper: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/hr-service.log
    max-size: 100MB
    max-history: 30

# ==================== CloudFlow 业务配置 ====================
cloudflow:
  # 多租户配置
  tenant:
    # 是否启用多租户功能
    enabled: true
    # 租户字段名
    column: tenant_id
    # 需要忽略租户过滤的表名列表
    ignore-tables:
      - sys_tenant
      - sys_menu
      - sys_dict_type
      - sys_dict_data
      - sys_config
    # 默认租户ID（当上下文中没有租户ID时使用）
    default-tenant-id: 100000
  # 文件存储配置
  file-storage:
    # 存储类型：local-本地存储, oss-对象存储
    type: local
    # 预签名 URL 过期时间（分钟）
    presigned-expire-minutes: 30
  # 对象存储配置（当 type=oss 时生效）
  oss:
    enabled: false
    config-key: default
    endpoint: localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: cloudflow-hr
    region: us-east-1
    is-https: N
    access-policy: 1
    prefix: hr
    domain:
  # 本地文件存储路径
  profile: /data/cloudflow/hr/profile
  # HR 业务配置
  hr:
    # 数据同步配置
    sync:
      # 是否启用启动时全量同步
      full-sync-on-startup: true
      # 定时增量同步间隔（分钟）
      incremental-sync-interval: 5
      # 是否启用 RabbitMQ 实时同步
      realtime-sync-enabled: true
    # 考勤配置
    attendance:
      # GPS 打卡允许范围（米）
      gps-range: 500
      # 迟到阈值（分钟）
      late-threshold: 15
      # 早退阈值（分钟）
      early-threshold: 15
    # 假期配置
    leave:
      # 年假计算规则：工作满1年后每年增加的天数
      annual-leave-days-per-year: 5
      # 年假最大天数
      annual-leave-max-days: 15
    # 加班配置
    overtime:
      # 工作日加班转调休比例
      workday-ratio: 1.0
      # 周末加班转调休比例
      weekend-ratio: 2.0
      # 节假日加班转调休比例
      holiday-ratio: 3.0
