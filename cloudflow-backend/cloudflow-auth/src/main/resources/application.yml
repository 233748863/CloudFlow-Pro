server:
  port: 9001

spring:
  application:
    name: cloudflow-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:cloudflow-common-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:${spring.application.name}.yaml?refresh=true
      - optional:nacos:cloudflow-common.yaml?refresh=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0

# Sa-Token 安全配置（本地后备，Nacos 配置优先）
cloudflow:
  # 本地文件存储根目录
  profile: /data/cloudflow/profile
  file-storage:
    # 文件存储类型，切换到 OSS 时改为 oss
    type: local
    # 私有 OSS 预签名地址有效期（分钟）
    presigned-expire-minutes: 30
  oss:
    # 仅当 file-storage.type=oss 时需要开启并配置
    enabled: false
    config-key: default
    endpoint: localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: cloudflow
    region: us-east-1
    is-https: N
    access-policy: 1
    prefix: upload
    domain:
  security:
    token:
      expiration: 1440
      refresh-time: 20

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  cookie-auto-fill-prefix: true
  is-read-header: true
  is-read-cookie: true
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.cloudflow.auth.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

logging:
  level:
    root: INFO
    com.cloudflow.auth: ${LOG_LEVEL_APP:INFO}
    com.cloudflow.auth.mapper: ${LOG_LEVEL_MAPPER:WARN}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9101}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Auth Service
    version: 1.0.0
