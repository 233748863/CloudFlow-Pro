server:
  port: 9001

spring:
  application:
    name: cloudflow-auth
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:cloudflow-auth.yaml
      - optional:nacos:cloudflow-common.yaml?refresh=true
  cloud:
    nacos:
      server-addr: 192.168.1.173:8848
      username: nacos
      password: nacos
      config:
        namespace: 886292cd-bfe3-4651-a67a-7604d2f4f3b9
        file-extension: yaml
      discovery:
        namespace: 886292cd-bfe3-4651-a67a-7604d2f4f3b9
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

# Sa-Token 安全配置（本地后备，Nacos 配置优先）
cloudflow:
  # 文件上传存储根路径
  profile: /data/cloudflow/profile
  security:
    token:
      expiration: 1440
      refresh-time: 20

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.cloudflow.auth.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
