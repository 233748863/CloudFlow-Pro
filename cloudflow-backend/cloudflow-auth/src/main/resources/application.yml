server:
  port: 9001

spring:
  application:
    name: cloudflow-auth
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:cloudflow-auth.yaml
      - optional:nacos:cloudflow-common.yaml?refresh=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:192.168.1.173:8848}
      username: nacos
      password: nacos
      config:
        namespace: ${NACOS_NAMESPACE:0ccb9313-39d8-4a58-9fa5-ce834b77e60d}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:0ccb9313-39d8-4a58-9fa5-ce834b77e60d}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

# Sa-Token 安全配置（本地后备，Nacos 配置优先）
cloudflow:
  # ???????????????
  profile: /data/cloudflow/profile
  file-storage:
    # ??????????? OSS ??? oss ??
    type: local
    # ?????????????????
    presigned-expire-minutes: 30
  oss:
    # ??? file-storage.type=oss ?????????????
    enabled: false
    config-key: default
    endpoint: localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: cloudflow
    region: us-east-1
    is-https: N
    access-policy: 1
    prefix: upload
    domain:
  security:
    token:
      expiration: 1440
      refresh-time: 20

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.cloudflow.auth.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Auth Service
    version: 1.0.0
