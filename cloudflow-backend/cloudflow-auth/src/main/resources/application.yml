server:
  port: 9001

spring:
  application:
    name: cloudflow-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:cloudflow-common-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:${spring.application.name}.yaml?refresh=true
      - optional:nacos:cloudflow-common.yaml?refresh=true
  cloud:
    openfeign:
      client:
        config:
          jobAuthExecution:
            connectTimeout: 3000
            readTimeout: 10000
          jobWorkflowExecution:
            connectTimeout: 3000
            readTimeout: 10000
          jobOaExecution:
            connectTimeout: 3000
            readTimeout: 10000
          jobCrmExecution:
            connectTimeout: 3000
            readTimeout: 10000
          jobHrExecution:
            connectTimeout: 3000
            readTimeout: 10000
    nacos:
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0

cloudflow:
  import:
    enabled: true
    retention-days: 30
    # Comma-separated bizType list, e.g. EMPLOYEE. Empty keeps originals for retention-days.
    delete-original-after-import: ${CLOUDFLOW_IMPORT_DELETE_ORIGINAL_AFTER_IMPORT:}
  job:
    internal-auth:
      keys:
        cloudflow-auth: ${CLOUDFLOW_JOB_AUTH_KEY:}
        cloudflow-service-hr: ${CLOUDFLOW_JOB_HR_KEY:}
        cloudflow-service-oa: ${CLOUDFLOW_JOB_OA_KEY:}
        cloudflow-service-crm: ${CLOUDFLOW_JOB_CRM_KEY:}
        cloudflow-service-workflow: ${CLOUDFLOW_JOB_WORKFLOW_KEY:}
    service-endpoints: true
    auth-url: ${CLOUDFLOW_JOB_AUTH_URL:}
    report-enabled: true
  codegen:
    enabled: ${CLOUDFLOW_CODEGEN_ENABLED:false}
  portal:
    enabled: ${CLOUDFLOW_PORTAL_ENABLED:false}
    public-url: ${CLOUDFLOW_PORTAL_PUBLIC_URL:}
  message:
    secret-key: ${CLOUDFLOW_MESSAGE_SECRET_KEY:}
    receiver-expand-limit: 500
    sms:
      daily-limit: 10
      expire-minutes: 5
  # 本地文件存储根目录
  profile: /data/cloudflow/profile
  auth:
    totp:
      enabled: ${CLOUDFLOW_TOTP_ENABLED:false}
      encryption-key: ${TOTP_ENCRYPTION_KEY:}
      # 轮换旧密钥：逗号分隔，只用于解密历史密文
      previous-encryption-keys: ${TOTP_PREVIOUS_ENCRYPTION_KEYS:}
      issuer: CloudFlow Pro
      challenge-ttl-seconds: 300
  workflow:
    callback:
      enabled: true
      stream-key: workflow:stream:approval-callback:auth
      group: group:auth:workflow-callback
      consumer-prefix: auth-callback
  file-storage:
    # 文件存储类型，切换到 OSS 时改为 oss
    type: local
    # 私有 OSS 预签名地址有效期（分钟）
    presigned-expire-minutes: 30
  oss:
    # 仅当 file-storage.type=oss 时需要开启并配置
    enabled: false
    config-key: default
    endpoint: localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: cloudflow
    region: us-east-1
    is-https: N
    access-policy: "0"
    prefix: upload
    domain:

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  cookie-auto-fill-prefix: true
  is-read-header: true
  is-read-cookie: true
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.cloudflow.auth.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.cloudflow.auth: ${LOG_LEVEL_APP:INFO}
    com.cloudflow.auth.mapper: ${LOG_LEVEL_MAPPER:WARN}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9101}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Auth Service
    version: 1.0.0
