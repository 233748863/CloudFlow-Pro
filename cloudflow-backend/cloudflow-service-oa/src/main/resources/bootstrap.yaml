spring:
  application:
    name: cloudflow-oa
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        shared-configs:
          - data-id: cloudflow-common.yaml
            refresh: true
        extension-configs:
          - data-id: cloudflow-oa.yaml
            refresh: true
      discovery:
        namespace: public
        group: DEFAULT_GROUP
