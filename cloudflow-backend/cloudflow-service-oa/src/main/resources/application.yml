server:
  port: 9003

spring:
  application:
    name: cloudflow-oa
  config:
    import:
      - optional:nacos:cloudflow-oa.yaml?refresh=true
      - optional:nacos:cloudflow-common.yaml?refresh=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:192.168.1.173:8848}
      username: nacos
      password: nacos
      config:
        namespace: ${NACOS_NAMESPACE:0ccb9313-39d8-4a58-9fa5-ce834b77e60d}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:0ccb9313-39d8-4a58-9fa5-ce834b77e60d}
        group: DEFAULT_GROUP
  # 本地数据源配置（Nacos不可用时的后备配置）
  datasource:
    url: jdbc:mysql://192.168.1.173:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: Juwangkeji@2025
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 本地Redis配置（Nacos不可用时的后备配置）
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: Juwangkeji@2025
      database: 0
      timeout: 3000ms

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.cloudflow.oa.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token 本地后备配置（Nacos cloudflow-common.yaml 不可用时生效）
cloudflow:
  security:
    token:
      expiration: 1440
      refresh-time: 20

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

# 日志配置
logging:
  level:
    com.cloudflow.oa: INFO
    com.cloudflow.oa.mapper: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow OA Service
    version: 1.0.0
