server:
  port: 9003

spring:
  application:
    name: cloudflow-oa

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.cloudflow.oa.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    com.cloudflow.oa: INFO
    com.cloudflow.oa.mapper: DEBUG
