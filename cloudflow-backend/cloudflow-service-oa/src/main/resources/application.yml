server:
  port: 9003

spring:
  autoconfigure:
    exclude:
      - io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimiterAutoConfiguration
      - io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimiterMetricsAutoConfiguration
      - io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimitersHealthIndicatorAutoConfiguration
  application:
    name: cloudflow-service-oa
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          oaFinanceFiles:
            connect-timeout: 3000
            read-timeout: 10000
          meetingRoomFiles:
            connect-timeout: 3000
            read-timeout: 10000
          oaRemoteWorkflowService:
            connect-timeout: 3000
            read-timeout: 10000
          cloudflow-service-crm:
            connect-timeout: 1000
            read-timeout: 2000
            logger-level: BASIC
          cloudflow-service-hr:
            connect-timeout: 1000
            read-timeout: 2000
            logger-level: BASIC
          cloudflow-service-workflow:
            connect-timeout: 1000
            read-timeout: 2000
            logger-level: BASIC
    nacos:
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
        group: DEFAULT_GROUP
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:cloudflow-common-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:${spring.application.name}.yaml?refresh=true
      - optional:nacos:cloudflow-common.yaml?refresh=true
  # 本地数据源配置（Nacos不可用时的后备配置）
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: ${DB_URL}
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
  # 本地Redis配置（Nacos不可用时的后备配置）
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms

resilience4j:
  timelimiter:
    instances:
      RemoteFinanceFileServiceuploadStringLongMultipartFile:
        timeout-duration: 15s
      RemoteWorkflowServicestartProcessInternalInternalWorkflowStartDTO:
        timeout-duration: 15s
      RemoteWorkflowServiceinvalidateByBusinessBusinessProcessInvalidateDTO:
        timeout-duration: 15s
      RemoteMeetingRoomFileServiceuploadLongMultipartFile:
        timeout-duration: 15s
      RemoteMeetingRoomFileServicecontentLongLong:
        timeout-duration: 15s
      RemoteContractTeamDirectoryemployeesList:
        timeout-duration: 5s
      RemoteCrmServicesyncReceivableInvoiceStatusStringStringLongInvoiceStatusSyncRequest:
        timeout-duration: 5s

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.cloudflow.oa.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  cookie-auto-fill-prefix: true
  is-read-header: true
  is-read-cookie: true
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

# 日志配置
logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'
  level:
    root: INFO
    com.cloudflow.oa: ${LOG_LEVEL_APP:INFO}
    com.cloudflow.oa.mapper: ${LOG_LEVEL_MAPPER:WARN}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9103}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow OA Service
    version: 1.0.0

cloudflow:
  job:
    internal-auth:
      keys:
        cloudflow-auth: ${CLOUDFLOW_JOB_AUTH_KEY:}
        cloudflow-service-oa: ${CLOUDFLOW_JOB_OA_KEY:}
  import:
    enabled: true
