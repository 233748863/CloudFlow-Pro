server:
  port: 9000

spring:
  application:
    name: cloudflow-gateway
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:cloudflow-gateway.yaml
      - optional:nacos:cloudflow-common.yaml?refresh=true
  cloud:
    nacos:
      server-addr: 192.168.1.173:8848
      username: nacos
      password: nacos
      config:
        namespace: 886292cd-bfe3-4651-a67a-7604d2f4f3b9
        file-extension: yaml
      discovery:
        namespace: 886292cd-bfe3-4651-a67a-7604d2f4f3b9
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: ${REDIS_PASSWORD:Juwangkeji@2025}
      database: 0

# Fallback JWT config (used if Nacos cloudflow-common.yaml is unavailable)
cloudflow:
  security:
    jwt:
      secret: cloudflow-jwt-secret-key-change-in-production-environment-min-32-chars
    token:
      expiration: 1440
      refresh-time: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
