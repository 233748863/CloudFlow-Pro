server:
  port: 9000

spring:
  application:
    name: cloudflow-gateway
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:cloudflow-gateway.yaml
      - optional:nacos:cloudflow-common.yaml?refresh=true
      - optional:file:./config/cloudflow-gateway.yaml
      - optional:file:../config/cloudflow-gateway.yaml
      - optional:file:../../config/cloudflow-gateway.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:192.168.1.173:8848}
      username: nacos
      password: nacos
      config:
        namespace: ${NACOS_NAMESPACE:0ccb9313-39d8-4a58-9fa5-ce834b77e60d}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:0ccb9313-39d8-4a58-9fa5-ce834b77e60d}
    gateway:
      lazy-routes-initialization: true
      routes:
        - id: cloudflow-auth
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: cloudflow-workflow
          uri: lb://cloudflow-service-workflow
          predicates:
            - Path=/workflow/**
          filters:
            - StripPrefix=1

        - id: cloudflow-oa
          uri: lb://cloudflow-oa
          predicates:
            - Path=/oa/**
          filters:
            - StripPrefix=1

        - id: cloudflow-crm
          uri: lb://cloudflow-service-crm
          predicates:
            - Path=/crm/**
          filters:
            - StripPrefix=1

        - id: cloudflow-hr
          uri: lb://cloudflow-service-hr
          predicates:
            - Path=/hr/**
          filters:
            - StripPrefix=1

        - id: cloudflow-ws
          uri: lb:ws://cloudflow-service-workflow
          predicates:
            - Path=/ws/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: ${REDIS_PASSWORD:Juwangkeji@2025}
      database: 0

# Fallback Sa-Token config (used if Nacos cloudflow-common.yaml is unavailable)
cloudflow:
  security:
    token:
      expiration: 1440
      refresh-time: 20

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  cookie-auto-fill-prefix: true
  is-read-header: true
  is-read-cookie: true
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Gateway Service
    version: 1.0.0
