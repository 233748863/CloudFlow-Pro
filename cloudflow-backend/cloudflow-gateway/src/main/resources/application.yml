server:
  port: 9000

spring:
  application:
    name: cloudflow-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:cloudflow-common-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:${spring.application.name}.yaml?refresh=true
      - optional:nacos:cloudflow-common.yaml?refresh=true
      - optional:file:./config/cloudflow-gateway.yaml
      - optional:file:../config/cloudflow-gateway.yaml
      - optional:file:../../config/cloudflow-gateway.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
    gateway:
      lazy-routes-initialization: true
      routes:
        - id: cloudflow-auth
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: cloudflow-workflow
          uri: lb://cloudflow-service-workflow
          predicates:
            - Path=/workflow/**
          filters:
            - StripPrefix=1

        - id: cloudflow-oa
          uri: lb://cloudflow-oa
          predicates:
            - Path=/oa/**
          filters:
            - StripPrefix=1

        - id: cloudflow-crm
          uri: lb://cloudflow-service-crm
          predicates:
            - Path=/crm/**
          filters:
            - StripPrefix=1

        - id: cloudflow-hr
          uri: lb://cloudflow-service-hr
          predicates:
            - Path=/hr/**
          filters:
            - StripPrefix=1

        - id: cloudflow-ws
          uri: lb:ws://cloudflow-service-workflow
          predicates:
            - Path=/ws/**

      globalcors:
        cors-configurations:
          '[/**]':
            # CORS 白名单：默认仅允许本地开发域名（含 Vite dev、Docker Nginx）；
            # 生产环境通过 CLOUDFLOW_CORS_ALLOWED_ORIGINS 环境变量（逗号分隔）覆盖为真实域名。
            # 注意：因 allow-credentials=true，浏览器禁止 Origin: *，必须显式枚举来源。
            allowed-origin-patterns: "${CLOUDFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost,http://localhost}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0

# Fallback Sa-Token config (used if Nacos cloudflow-common.yaml is unavailable)
cloudflow:
  security:
    token:
      expiration: 1440
      refresh-time: 20

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  cookie-auto-fill-prefix: true
  is-read-header: true
  is-read-cookie: true
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Gateway Service
    version: 1.0.0
