# ============================================================
# CloudFlow Pro - Workflow Service 配置
# ============================================================
# 敏感配置（数据库密码、Redis密码等）通过 Nacos 配置中心管理
# 本地开发时可通过环境变量覆盖，或在 Nacos 中配置 cloudflow-common.yaml
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # HikariCP 连接池配置
    hikari:
      pool-name: CloudFlowHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      auto-commit: true
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000
        shutdown-timeout: 100

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.cloudflow.workflow.domain
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境使用 SLF4J 日志，开发环境可切换为 StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging:
  level:
    root: INFO
    com.cloudflow: INFO
    com.cloudflow.workflow.mapper: ${SQL_LOG_LEVEL:WARN}
