# ============================================================
# CloudFlow Pro - Workflow Service 配置
# ============================================================
# 敏感配置（数据库密码、Redis密码等）通过 Nacos 配置中心管理
# 本地开发时可通过环境变量覆盖，或在 Nacos 中配置 cloudflow-common.yaml
# ============================================================

server:
  port: 9002

spring:
  application:
    name: cloudflow-service-workflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    nacos:
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:cloudflow-${spring.profiles.active}}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:cloudflow-common-${spring.profiles.active}.yaml?refresh=true
      - optional:nacos:${spring.application.name}.yaml?refresh=true
      - optional:nacos:cloudflow-common.yaml?refresh=true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # HikariCP 连接池配置
    hikari:
      pool-name: CloudFlowHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      auto-commit: true
      leak-detection-threshold: 60000
      validation-timeout: 5000
      register-mbeans: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000
        shutdown-timeout: 100

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.cloudflow.workflow.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 本地后备配置（Nacos cloudflow-common.yaml 不可用时生效）
cloudflow:
  encrypt:
    enabled: false
  security:
    token:
      expiration: 1440
      refresh-time: 20
  tenant:
    enabled: true
    column: tenant_id
    # workflow 服务的跨租户系统表（DLQ / 对账告警 / 平台级系统表）
    ignore-tables:
      - sys_tenant
      - sys_menu
      - sys_dict_type
      - sys_dict_data
      - sys_config
      - wf_callback_dead_letter
      - wf_reconcile_alert
    default-tenant-id: 100000
  workflow:
    script:
      enabled: false
      timeout-ms: 5000
    task:
      # 任务办理人归属严格校验：true=必须 task.assignee 本人发起加签/减签/委派；false=跳过校验（仅 @SaCheckPermission 兜底）
      strict-owner: true
      # 持有该权限码的账号跨人操作时放行（admin 通过 sys_role_menu 默认绑定，见 06.cloudflow-business-seed.sql 1100）
      override-permission: workflow:task:override

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  cookie-auto-fill-prefix: true
  is-read-header: true
  is-read-cookie: true
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: -1
  is-log: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9102}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: CloudFlow Workflow Service
    version: 1.0.0

# 日志配置
logging:
  level:
    root: INFO
    com.cloudflow: ${LOG_LEVEL_APP:INFO}
    com.cloudflow.workflow.mapper: ${LOG_LEVEL_MAPPER:WARN}
