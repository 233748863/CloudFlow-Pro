server:
  port: 9002

spring:
  application:
    name: cloudflow-service-workflow
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
        shared-configs:
          - data-id: cloudflow-common.yaml
            refresh: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
