server:
  port: 9988

spring:
  application:
    name: @artifactId@
  profiles:
    active: dev
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: ${NACOS_HOST:nacos}:${NACOS_PORT:8848}
        namespace: @nacos.namespace@
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: @nacos.namespace@
  config:
    import:
      - optional:nacos:application-@profiles.active@.yml?refreshEnabled=true
      - optional:nacos:${spring.application.name}-@profiles.active@.yml?refreshEnabled=true
