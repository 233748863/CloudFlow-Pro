# CloudFlow Workflow 工作流服务配置文件
# 此配置文件应上传到 Nacos 配置中心
# Data ID: cloudflow-service-workflow.yaml
# Group: DEFAULT_GROUP

spring:
  datasource:
    url: jdbc:mysql://192.168.1.173:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: Juwangkeji@2025
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: WorkflowHikariCP
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: Juwangkeji@2025
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 5

# 工作流引擎配置
workflow:
  engine:
    # 流程实例配置
    process:
      max-concurrent-instances: 1000
      instance-timeout-hours: 72
      auto-cleanup-completed: true
      cleanup-after-days: 30
    
    # 任务配置
    task:
      default-timeout-hours: 24
      max-retry-attempts: 3
      retry-delay-seconds: 60
      enable-auto-claim: true
      auto-claim-timeout-minutes: 30
    
    # 审批配置
    approval:
      default-timeout-hours: 48
      enable-auto-pass: false
      enable-delegation: true
      enable-countersign: true
      min-countersign-ratio: 0.5
    
    # 通知配置
    notification:
      enabled: true
      channels:
        - EMAIL
        - SMS
        - SYSTEM
      retry-failed: true
      max-retry-attempts: 3
    
    # 部署配置
    deployment:
      enable-version-control: true
      enable-rollback: true
      max-rollback-versions: 10
      require-approval: true
      enable-impact-analysis: true
      enable-deployment-window: true

# 流程设计器配置
designer:
  canvas:
    grid-size: 20
    snap-to-grid: true
    auto-layout: true
  
  validation:
    strict-mode: false
    allow-empty-process: false
    require-start-node: true
    require-end-node: true

# 表单引擎配置
form:
  engine:
    enable-validation: true
    enable-auto-save: true
    auto-save-interval-seconds: 30
    max-file-size-mb: 10
    allowed-file-types:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - jpg
      - jpeg
      - png
      - gif

# 监控配置
monitoring:
  metrics:
    enabled: true
    export-interval-seconds: 60
  
  alerts:
    enabled: true
    thresholds:
      process-timeout-rate: 0.1
      task-timeout-rate: 0.15
      approval-timeout-rate: 0.2
      error-rate: 0.05

# 性能优化配置
performance:
  cache:
    enabled: true
    ttl-seconds: 3600
    max-size: 10000
  
  async:
    enabled: true
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 1000

# 日志配置
logging:
  level:
    com.cloudflow.workflow: DEBUG
    com.cloudflow.workflow.mapper: DEBUG
    com.cloudflow.workflow.service: INFO
    com.cloudflow.workflow.controller: INFO

# Feign 配置
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
  hystrix:
    enabled: true

# Hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 10000
