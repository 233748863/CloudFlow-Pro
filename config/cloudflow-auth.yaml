# CloudFlow Auth 认证服务配置文件
# 此配置文件应上传到 Nacos 配置中心
# Data ID: cloudflow-auth.yaml
# Group: DEFAULT_GROUP

spring:
  # ==================== 多数据源配置（dynamic-datasource） ====================
  # 使用 @DS("数据源名") 注解在 Mapper 层切换数据源
  # 不加 @DS 注解的 Mapper 默认使用 primary 指定的数据源
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        # ---- 主数据源（认证业务库） ----
        master:
          url: jdbc:mysql://192.168.1.173:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: Juwangkeji@2025
          driver-class-name: com.mysql.cj.jdbc.Driver
        # ---- 按需添加更多数据源 ----
        # slave:
        #   url: jdbc:mysql://192.168.1.173:3306/cloud_flow_slave?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        #   username: root
        #   password: Juwangkeji@2025
        #   driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: AuthHikariCP
        minimum-idle: 5
        maximum-pool-size: 20
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
  
  data:
    redis:
      host: 192.168.1.173
      port: 6379
      password: Juwangkeji@2025
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# JWT 配置（SecurityProperties 使用 cloudflow.security 前缀）
cloudflow:
  # 文件上传存储根路径
  profile: /data/cloudflow/profile
  security:
    jwt:
      secret: cloudflow-jwt-secret-key-change-in-production-environment-min-32-chars
    token:
      expiration: 1440  # 令牌有效期（分钟）= 24小时
      refresh-time: 20   # 令牌刷新时间（分钟）

# 兼容旧配置路径
jwt:
  secret: cloudflow-jwt-secret-key-change-in-production-environment-min-32-chars
  expiration: 86400  # 24小时（秒）
  refresh-expiration: 604800  # 7天（秒）
  header: Authorization
  token-prefix: Bearer 

# 认证配置
auth:
  # 密码策略
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special-char: false
    max-attempts: 5
    lock-duration-minutes: 30
  
  # 验证码配置
  captcha:
    enabled: true
    length: 4
    expire-seconds: 300
    type: MATH  # MATH, CHAR, CHINESE
  
  # 会话配置
  session:
    timeout-minutes: 30
    max-concurrent-sessions: 1
    prevent-login-after-logout: false
  
  # 白名单路径（不需要认证）
  whitelist:
    - /auth/login
    - /auth/register
    - /auth/captcha
    - /auth/refresh-token
    - /actuator/health

# 日志配置
logging:
  level:
    com.cloudflow.auth: DEBUG
    com.cloudflow.auth.mapper: DEBUG
