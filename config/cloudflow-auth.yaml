# JWT 配置（SecurityProperties 使用 cloudflow.security 前缀）
cloudflow:
  security:
    jwt:
      secret: cloudflow-jwt-secret-key-change-in-production-environment-min-32-chars
    token:
      expiration: 1440  # 令牌有效期（分钟）= 24小时
      refresh-time: 20   # 令牌刷新时间（分钟）

# 兼容旧配置路径
jwt:
  secret: cloudflow-jwt-secret-key-change-in-production-environment-min-32-chars
  expiration: 86400  # 24小时（秒）
  refresh-expiration: 604800  # 7天（秒）
  header: Authorization
  token-prefix: Bearer 

# 认证配置
auth:
  # 密码策略
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special-char: false
    max-attempts: 5
    lock-duration-minutes: 30
  
  # 验证码配置
  captcha:
    enabled: true
    length: 4
    expire-seconds: 300
    type: MATH  # MATH, CHAR, CHINESE
  
  # 会话配置
  session:
    timeout-minutes: 30
    max-concurrent-sessions: 1
    prevent-login-after-logout: false
  
  # 白名单路径（不需要认证）
  whitelist:
    - /auth/login
    - /auth/register
    - /auth/captcha
    - /auth/refresh-token
    - /actuator/health

# 日志配置
logging:
  level:
    com.cloudflow.auth: DEBUG
    com.cloudflow.auth.mapper: DEBUG
