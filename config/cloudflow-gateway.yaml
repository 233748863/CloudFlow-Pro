cloudflow:
  tenant:
    default-tenant-id: 100000

spring:
  cloud:
    gateway:
      lazy-routes-initialization: true
      routes:
        - id: cloudflow-auth
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: auth-login
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/login
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-register
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/register
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-captcha-slider
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/captcha/slider
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-captcha-check
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/captcha/check
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-tenant-options
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/tenant/options
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                # 与历史 @RateLimiter(count=10, time=60s) 等效：补偿速率约 0.17/s，桶 10
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        - id: cloudflow-workflow
          uri: lb://cloudflow-service-workflow
          predicates:
            - Path=/workflow/**
          filters:
            - StripPrefix=1

        - id: workflow-start
          uri: lb://cloudflow-service-workflow
          predicates:
            - Path=/workflow/wf/start
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 50
                key-resolver: "#{@userKeyResolver}"

        - id: cloudflow-service-oa
          uri: lb://cloudflow-service-oa
          predicates:
            - Path=/oa/**
          filters:
            - StripPrefix=1

        - id: cloudflow-crm
          uri: lb://cloudflow-service-crm
          predicates:
            - Path=/crm/**
          filters:
            - StripPrefix=1

        - id: cloudflow-hr
          uri: lb://cloudflow-service-hr
          predicates:
            - Path=/hr/**
          filters:
            - StripPrefix=1

        # WebSocket 路由：StripPrefix=0 保留 /ws 前缀，
        # 上游 cloudflow-service-workflow 通过 WebSocketConfig#registerWebSocketHandlers
        # 注册 /ws/notifications，必须保持路径一致。
        - id: cloudflow-ws
          uri: lb:ws://cloudflow-service-workflow
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=0

      globalcors:
        cors-configurations:
          '[/**]':
            # CORS 白名单：默认仅允许本地开发域名（含 Vite dev、Docker Nginx）；
            # 生产环境通过 CLOUDFLOW_CORS_ALLOWED_ORIGINS 环境变量（逗号分隔）覆盖为真实域名。
            # 注意：因 allow-credentials=true，浏览器禁止 Origin: *，必须显式枚举来源。
            allowed-origin-patterns: "${CLOUDFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost,http://localhost}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
