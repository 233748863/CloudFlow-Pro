# CloudFlow Gateway路由配置
# 此配置文件应上传到Nacos配置中心

# 网关层租户配置（TenantWebFilter / AuthFilter 使用）
cloudflow:
  tenant:
    default-tenant-id: 100000

spring:
  cloud:
    gateway:
      routes:
        # 认证服务路由
        - id: cloudflow-auth
          uri: lb://cloudflow-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        
        # 工作流服务路由
        - id: cloudflow-workflow
          uri: lb://cloudflow-service-workflow
          predicates:
            - Path=/workflow/**
          filters:
            - StripPrefix=1
        
        # OA服务路由
        - id: cloudflow-oa
          uri: lb://cloudflow-oa
          predicates:
            - Path=/oa/**
          filters:
            - StripPrefix=1
        
        # WebSocket 路由（通知推送，由 workflow 服务承载）
        - id: cloudflow-ws
          uri: lb:ws://cloudflow-service-workflow
          predicates:
            - Path=/ws/**
      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
