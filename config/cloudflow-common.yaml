# ============================================================
# CloudFlow Pro - Nacos 共享配置
# ============================================================
# 此配置文件应上传到 Nacos 配置中心
# Data ID: cloudflow-common.yaml
# Group: DEFAULT_GROUP
# ============================================================
# 使用说明：
# 1. 登录 Nacos 控制台 (http://localhost:8848/nacos)
# 2. 进入"配置管理" -> "配置列表"
# 3. 点击"+"创建配置
# 4. Data ID: cloudflow-common.yaml
# 5. Group: DEFAULT_GROUP
# 6. 配置格式: YAML
# 7. 将下面的内容复制粘贴到配置内容中
# 8. 根据实际环境修改敏感信息（数据库密码、Redis密码等）
# ============================================================

# ==================== 多数据源配置（dynamic-datasource） ====================
# 各服务共享的数据源基础配置
# 各服务可在自己的配置文件中覆盖或新增数据源
# 使用 @DS("数据源名") 注解在 Mapper 层切换数据源
spring:
  datasource:
    dynamic:
      # 默认数据源名称，不加 @DS 注解时使用此数据源
      primary: master
      # 严格模式：false 表示未匹配到数据源时使用默认数据源
      strict: false
      datasource:
        # ---- 主数据源 ----
        master:
          url: ${DB_URL:jdbc:mysql://192.168.1.173:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&${MYSQL_SSL_PARAMS:useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true}&serverTimezone=Asia/Shanghai}
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
      # HikariCP 连接池全局配置（所有数据源共享）
      hikari:
        pool-name: CloudFlowHikariCP
        minimum-idle: 10
        maximum-pool-size: 50
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.173}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3000
        shutdown-timeout: 100

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.cloudflow: ${LOG_LEVEL_APP:INFO}
    com.cloudflow.workflow.mapper: ${LOG_LEVEL_MAPPER:WARN}
    com.cloudflow.oa.mapper: ${LOG_LEVEL_MAPPER:WARN}

# Sa-Token 安全配置（SecurityProperties 使用 cloudflow.security 前缀）
cloudflow:
  # 文件上传存储根路径
  profile: /data/cloudflow/profile
  encrypt:
    enabled: false

  # ==================== 多租户配置 ====================
  # 对应 TenantConfigProperties 类
  # 所有服务共享此配置，控制 SQL 自动追加 tenant_id 条件
  tenant:
    # 是否启用多租户功能（false 时不注册 TenantLineInnerInterceptor）
    enabled: true
    # 租户字段名
    column: tenant_id
    # 默认租户ID（未登录或上下文无租户时使用）
    default-tenant-id: 100000
    # 忽略租户过滤的表（这些表不追加 WHERE tenant_id = ? 条件）
    ignore-tables:
      - sys_tenant
      - sys_menu
      - sys_dict_type
      - sys_dict_data
      - sys_config
      - workflow_template
      - template_category

  security:
    token:
      expiration: 1440  # 令牌有效期（分钟）= 24小时
      refresh-time: 20   # 令牌刷新时间（分钟）
  ratelimit:
    trusted-proxies:
      - 127.0.0.1/32
      - ::1/128
      - 172.20.0.0/16
      - 10.0.0.0/8
      - 192.168.0.0/16

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-concurrent: false
  is-share: false
  timeout: 86400  # 24小时（秒）
  active-timeout: -1
  is-log: false

# 文件上传配置
file:
  upload:
    path: /data/cloudflow/uploads
    max-size: 10485760  # 10MB

# ============================================================
# 开发环境配置示例（可选）
# 如需为开发环境创建单独配置，可创建 cloudflow-common-dev.yaml
# ============================================================
