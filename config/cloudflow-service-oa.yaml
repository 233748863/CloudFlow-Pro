# CloudFlow OA服务配置文件
# 此配置文件应上传到Nacos配置中心

spring:
  # ==================== 多数据源配置（dynamic-datasource） ====================
  # 使用 @DS("数据源名") 注解在 Mapper 层切换数据源
  # 不加 @DS 注解的 Mapper 默认使用 primary 指定的数据源
  datasource:
    dynamic:
      # 默认数据源名称，不加 @DS 注解时使用此数据源
      primary: master
      # 严格模式：true 表示未匹配到数据源时抛异常，false 则使用默认数据源
      strict: false
      datasource:
        # ---- 主数据源（OA 业务库） ----
        master:
          url: ${DB_URL:jdbc:mysql://192.168.1.173:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&${MYSQL_SSL_PARAMS:useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true}&serverTimezone=Asia/Shanghai}
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
        # ---- 报表/只读数据源（示例，按需修改连接信息） ----
        # report:
        #   url: jdbc:mysql://192.168.1.173:3306/cloud_flow_report?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        #   username: ${DB_USERNAME:root}
        #   password: ${DB_PASSWORD}
        #   driver-class-name: com.mysql.cj.jdbc.Driver
        # ---- 第三方/外部数据源（示例，按需修改连接信息） ----
        # thirdparty:
        #   url: jdbc:mysql://192.168.1.200:3306/third_party_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        #   username: ${DB_USERNAME:root}
        #   password: your_password
        #   driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.173}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# OA模块业务配置
cloudflow:
  oa:
    # 公告配置
    announcement:
      default-expire-days: 30
      max-attachment-size: 10
      allow-anonymous-read: false

    # 资产配置
    asset:
      enable-qr-code: true
      qr-code-prefix: "ASSET-"
      qr-code-size: 200
      depreciation-method: "STRAIGHT_LINE"

    # 车辆配置
    vehicle:
      max-booking-days: 7
      advance-booking-hours: 2
      allow-concurrent-booking: false
      fuel-price-update-cron: "0 0 2 * * ?"

    # 考勤配置
    attendance:
      work-start-time: "09:00"
      work-end-time: "18:00"
      late-threshold-minutes: 15
      early-leave-threshold-minutes: 15
      overtime-threshold-minutes: 30
      check-in-radius-meters: 500

    # 错误上报配置
    error-report:
      enabled: true
      allow-anonymous-path: "/dashboard"
      ip-limit-count: 20
      ip-limit-window-seconds: 60

    # 离线同步配置
    sync:
      conflict-strategy: "LAST_WRITE_WINS"
      time-tolerance-seconds: 5

    # 会议室配置
    meeting-room:
      max-booking-hours: 4
      advance-booking-hours: 1
      allow-concurrent-booking: false
      auto-release-minutes: 15

  workflow:
    callback:
      stream-key: workflow:stream:approval-callback:oa
      group: group:oa:workflow-callback
      consumer-prefix: oa-callback

# Feign配置
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

logging:
  level:
    root: INFO
    com.cloudflow.oa: ${LOG_LEVEL_APP:INFO}
    com.cloudflow.oa.mapper: ${LOG_LEVEL_MAPPER:WARN}
