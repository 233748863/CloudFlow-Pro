name: Build and Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build Backend with Maven
      run: |
        cd cloudflow-backend
        mvn clean package -DskipTests
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: cloudflow-frontend/package-lock.json
        
    - name: Build Frontend
      run: |
        cd cloudflow-frontend
        npm install
        npm run build
        
    - name: Build Docker Image
      run: |
        docker build -t cloudflow-workflow:latest .
