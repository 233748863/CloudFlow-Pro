name: Build and Publish

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build Backend with Maven
      run: |
        cd cloudflow-backend
        mvn clean verify

    - name: Scan hard-coded secrets
      run: |
        set -euo pipefail
        BAD_DB_SECRET="$(printf '%s%s' 'Juwangkeji@' '2025')"
        BAD_MYSQL_DEFAULT="$(printf '%s%s' 'cloudflow_' '2026')"
        BAD_REDIS_DEFAULT="$(printf '%s%s' 'cloudflow_redis_' '2026')"
        BAD_NACOS_TOKEN="$(printf '%s%s' 'SecretKey' '0123456789')"
        printf '::add-mask::%s\n' "$BAD_DB_SECRET"
        printf '::add-mask::%s\n' "$BAD_MYSQL_DEFAULT"
        printf '::add-mask::%s\n' "$BAD_REDIS_DEFAULT"
        printf '::add-mask::%s\n' "$BAD_NACOS_TOKEN"
        if git grep -n -E "${BAD_DB_SECRET}|${BAD_MYSQL_DEFAULT}|${BAD_REDIS_DEFAULT}|${BAD_NACOS_TOKEN}|\$\{[^}]*:[^}]*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][^}]*\}" -- . ':(exclude)后端审计报告.md' ':(exclude)P0修复方案.md' ':(exclude)Docker部署配置审查报告.md'; then
          echo "Hard-coded secrets or password fallbacks detected"
          exit 1
        fi
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: cloudflow-frontend/package-lock.json
        
    - name: Build Frontend
      run: |
        cd cloudflow-frontend
        npm ci
        npm run type-check
        npm run build
        
    - name: Build Docker Image
      run: |
        docker build -t cloudflow-workflow:latest .
