version: '3'
services:
  poco-ui:
    build:
      context: .
    restart: always
    container_name: poco-ui
    image: poco-ui
    networks:
      - spring_cloud_default
    external_links:
      - poco-gateway
    ports:
      - 80:80
# 加入到后端网络， 默认为 poco_default  | docker network ls   查看
networks:
  spring_cloud_default:
    external: true
