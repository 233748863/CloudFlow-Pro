# ============================================================
# CloudFlow Pro - Docker Compose 编排配置
# ============================================================
# 使用前请先复制 .env.example 为 .env 并修改配置
# 启动命令: docker compose up -d
# 查看日志: docker compose logs -f [服务名]
# ============================================================

services:
  # ============================================================
  # 基础设施层 (Infrastructure Layer)
  # ============================================================

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: cloudflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cloud_flow_db
      MYSQL_USER: ${MYSQL_APP_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 按顺序加载初始化 SQL（Docker 按文件名字母序执行 initdb.d 中的脚本）
      - ./cloudflow-backend/DB/01.cloudflow-common.sql:/docker-entrypoint-initdb.d/01.cloudflow-common.sql:ro
      - ./cloudflow-backend/DB/02.cloudflow-workflow.sql:/docker-entrypoint-initdb.d/02.cloudflow-workflow.sql:ro
      - ./cloudflow-backend/DB/03.cloudflow-hr.sql:/docker-entrypoint-initdb.d/03.cloudflow-hr.sql:ro
      - ./cloudflow-backend/DB/04.cloudflow-oa.sql:/docker-entrypoint-initdb.d/04.cloudflow-oa.sql:ro
      - ./cloudflow-backend/DB/05.cloudflow-crm.sql:/docker-entrypoint-initdb.d/05.cloudflow-crm.sql:ro
      - ./cloudflow-backend/DB/06.cloudflow-business-seed.sql:/docker-entrypoint-initdb.d/06.cloudflow-business-seed.sql:ro
      - ./cloudflow-backend/DB/07.cloudflow-demo-seed.sql:/docker-entrypoint-initdb.d/07.cloudflow-demo-seed.sql:ro
      - ./scripts/check-db-init.sh:/docker-entrypoint-initdb.d/99-check-init.sh:ro
    # MySQL 核心参数，修改后 docker compose restart mysql 即可生效
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --slow-query-log=1
      --long-query-time=2
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network

  # Redis 缓存
  redis:
    image: redis:7.2-alpine
    container_name: cloudflow-redis
    restart: unless-stopped
    # Redis 核心参数，修改后 docker compose restart redis 即可生效
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --maxclients 1000
      --slowlog-log-slower-than 10000
      --slowlog-max-len 128
      --activedefrag yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network

  # ============================================================
  # 配置中心 & 服务注册中心 (Nacos)
  # ============================================================

  nacos:
    build:
      context: ./docker/nacos
      dockerfile: Dockerfile
    container_name: cloudflow-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: cloud_flow_db
      MYSQL_SERVICE_USER: ${MYSQL_APP_USERNAME}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_APP_PASSWORD}
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_logs:/home/nacos/logs
      - nacos_data:/home/nacos/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================
  # 微服务层 (Microservices Layer)
  # ============================================================

  # API 网关（端口 9000）
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: cloudflow-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-cloudflow-${SPRING_PROFILES_ACTIVE:-prod}}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      DB_USERNAME: ${MYSQL_APP_USERNAME}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_MAPPER: ${LOG_LEVEL_MAPPER}
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL}
      # CORS 白名单：逗号分隔的允许 Origin 列表；默认覆盖 Docker 前端 Nginx（https+http）和 Vite 开发端口
      CLOUDFLOW_CORS_ALLOWED_ORIGINS: ${CLOUDFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,https://localhost,http://localhost}
      MANAGEMENT_SERVER_PORT: 9100
      CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED: ${CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED:-true}
      CLOUDFLOW_SECURITY_PROMETHEUS_USERNAME: prometheus
      CLOUDFLOW_SECURITY_PROMETHEUS_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD}
      # JVM 参数
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "9000:9000"
    volumes:
      # 日志目录映射到物理机，便于排查问题和日志收集
      - gateway_logs:/app/logs
      # 外部配置文件（可选，用于覆盖 jar 内配置）
      - ./config/cloudflow-gateway.yaml:/app/config/cloudflow-gateway.yaml:ro
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # 认证服务（端口 9001）
  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    container_name: cloudflow-auth
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-cloudflow-${SPRING_PROFILES_ACTIVE:-prod}}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      DB_URL: jdbc:mysql://mysql:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&${MYSQL_SSL_PARAMS}&serverTimezone=GMT%2B8
      DB_USERNAME: ${MYSQL_APP_USERNAME}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_MAPPER: ${LOG_LEVEL_MAPPER}
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL}
      MANAGEMENT_SERVER_PORT: 9101
      CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED: ${CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED:-true}
      CLOUDFLOW_SECURITY_PROMETHEUS_USERNAME: prometheus
      CLOUDFLOW_SECURITY_PROMETHEUS_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    volumes:
      # 日志目录映射
      - auth_logs:/app/logs
      # 外部配置文件
      - ./config/cloudflow-auth.yaml:/app/config/cloudflow-auth.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # 工作流服务（端口 9002）
  workflow:
    build:
      context: .
      dockerfile: docker/workflow/Dockerfile
    container_name: cloudflow-workflow
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-cloudflow-${SPRING_PROFILES_ACTIVE:-prod}}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      DB_URL: jdbc:mysql://mysql:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&${MYSQL_SSL_PARAMS}&serverTimezone=GMT%2B8
      DB_USERNAME: ${MYSQL_APP_USERNAME}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_MAPPER: ${LOG_LEVEL_MAPPER}
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL}
      MANAGEMENT_SERVER_PORT: 9102
      CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED: ${CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED:-true}
      CLOUDFLOW_SECURITY_PROMETHEUS_USERNAME: prometheus
      CLOUDFLOW_SECURITY_PROMETHEUS_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD}
      # AI 代码产物生成：密钥只注入后端容器，不进入前端产物
      AI_ENABLED: ${AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0"
    volumes:
      # 日志目录映射
      - workflow_logs:/app/logs
      # 文件上传目录映射到物理机（持久化用户上传的文件）
      - upload_data:/data/cloudflow/uploads
      # 外部配置文件
      - ./config/cloudflow-service-workflow.yaml:/app/config/cloudflow-service-workflow.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9102/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # OA 服务（端口 9003）
  oa:
    build:
      context: .
      dockerfile: docker/oa/Dockerfile
    container_name: cloudflow-service-oa
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-cloudflow-${SPRING_PROFILES_ACTIVE:-prod}}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      DB_URL: jdbc:mysql://mysql:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&${MYSQL_SSL_PARAMS}&serverTimezone=GMT%2B8
      DB_USERNAME: ${MYSQL_APP_USERNAME}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_MAPPER: ${LOG_LEVEL_MAPPER}
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL}
      MANAGEMENT_SERVER_PORT: 9103
      CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED: ${CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED:-true}
      CLOUDFLOW_SECURITY_PROMETHEUS_USERNAME: prometheus
      CLOUDFLOW_SECURITY_PROMETHEUS_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    volumes:
      # 日志目录映射
      - oa_logs:/app/logs
      # 文件上传目录（与 workflow 共享，OA 审批附件等）
      - upload_data:/data/cloudflow/uploads
      # 外部配置文件
      - ./config/cloudflow-service-oa.yaml:/app/config/cloudflow-service-oa.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9103/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # CRM 服务（端口 9004）
  crm:
    build:
      context: .
      dockerfile: docker/crm/Dockerfile
    container_name: cloudflow-crm
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-cloudflow-${SPRING_PROFILES_ACTIVE:-prod}}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      DB_URL: jdbc:mysql://mysql:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&${MYSQL_SSL_PARAMS}&serverTimezone=GMT%2B8
      DB_USERNAME: ${MYSQL_APP_USERNAME}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_MAPPER: ${LOG_LEVEL_MAPPER}
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL}
      MANAGEMENT_SERVER_PORT: 9104
      CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED: ${CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED:-true}
      CLOUDFLOW_SECURITY_PROMETHEUS_USERNAME: prometheus
      CLOUDFLOW_SECURITY_PROMETHEUS_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    volumes:
      - crm_logs:/app/logs
      - upload_data:/data/cloudflow/uploads
      - ./config/cloudflow-service-crm.yaml:/app/config/cloudflow-service-crm.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9104/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # HR 服务（端口 9005）
  hr:
    build:
      context: .
      dockerfile: docker/hr/Dockerfile
    container_name: cloudflow-hr
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-cloudflow-${SPRING_PROFILES_ACTIVE:-prod}}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      DB_URL: jdbc:mysql://mysql:3306/cloud_flow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&${MYSQL_SSL_PARAMS}&serverTimezone=GMT%2B8
      DB_USERNAME: ${MYSQL_APP_USERNAME}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_MAPPER: ${LOG_LEVEL_MAPPER}
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL}
      MANAGEMENT_SERVER_PORT: 9105
      CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED: ${CLOUDFLOW_SECURITY_PROMETHEUS_ENABLED:-true}
      CLOUDFLOW_SECURITY_PROMETHEUS_USERNAME: prometheus
      CLOUDFLOW_SECURITY_PROMETHEUS_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0"
    volumes:
      - hr_logs:/app/logs
      - ./config/cloudflow-service-hr.yaml:/app/config/cloudflow-service-hr.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9105/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================
  # 监控层 (Monitoring Layer)
  # ============================================================

  # Prometheus：采集各微服务 Actuator 指标。
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cloudflow-prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /etc/prometheus/docker-entrypoint.sh
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    environment:
      PROMETHEUS_SCRAPE_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD}
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker/monitoring/prometheus/docker-entrypoint.sh:/etc/prometheus/docker-entrypoint.sh:ro
      - prometheus_data:/prometheus
    depends_on:
      - gateway
      - auth
      - workflow
      - oa
      - crm
      - hr
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Grafana：加载默认数据源和监控看板。
  grafana:
    image: grafana/grafana:11.2.2
    container_name: cloudflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  # ============================================================
  # 前端层 (Frontend Layer)
  # ============================================================

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: cloudflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 日志映射到物理机
      - nginx_logs:/var/log/nginx
      # SSL 证书目录（生产环境需提供 cert.pem 和 key.pem）
      - ./docker/frontend/ssl:/etc/nginx/ssl:ro
      # 可选：自定义 nginx 配置热更新（无需重新构建镜像）
      - ./docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloudflow-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

# ============================================================
# 网络配置
# ============================================================
networks:
  cloudflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# 数据卷
# ============================================================
volumes:
  # 基础设施数据卷
  mysql_data:
    driver: local
  redis_data:
    driver: local
  nacos_logs:
    driver: local
  nacos_data:
    driver: local
  # 微服务日志卷
  gateway_logs:
    driver: local
  auth_logs:
    driver: local
  workflow_logs:
    driver: local
  oa_logs:
    driver: local
  crm_logs:
    driver: local
  hr_logs:
    driver: local
  # 前端日志卷
  nginx_logs:
    driver: local
  # 业务数据卷
  upload_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
