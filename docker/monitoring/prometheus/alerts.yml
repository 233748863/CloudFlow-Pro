groups:
  - name: cloudflow_alerts
    interval: 30s
    rules:
      - alert: CloudFlowServiceDown
        expr: up{job=~"cloudflow-.+"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus has not scraped {{ $labels.job }} successfully for 1 minute."

      - alert: CloudFlowHighJvmHeapUsage
        expr: (sum by (job) (jvm_memory_used_bytes{area="heap"}) / sum by (job) (jvm_memory_max_bytes{area="heap"} > 0)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage is above 90% for {{ $labels.job }}"
          description: "Heap memory ratio for {{ $labels.job }} has stayed above 0.90 for 5 minutes."

      - alert: CloudFlowHighHttp5xxRate
        expr: sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate is elevated for {{ $labels.job }}"
          description: "The 5xx response rate for {{ $labels.job }} has exceeded 0.1 requests/second for 5 minutes."
